---
name: Unit Tests

on: # NOLINT
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.13]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tools
        run: |
          python -m pip install --upgrade numpy
          python -m pip install --upgrade statick
          sudo apt-get update
          sudo apt-get install chktex
          sudo apt-get install lacheck

      - name: Statick
        run: |
          statick . --check --user-paths statick_config --level tex_with_pylint

      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: mae283_lectures.tex

      - name: Upload PDF file
        uses: actions/upload-artifact@v5
        with:
          name: mae283_lectures.pdf
          path: mae283_lectures.pdf
